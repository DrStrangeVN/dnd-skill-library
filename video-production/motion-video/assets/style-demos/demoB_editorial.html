*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:radial-gradient(1000px 800px at 50% 30%,#1a1440 0%,#0B0A1A 60%,#060510 100%);color:#fff;font-family:'Plus Jakarta Sans';overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pill{display:inline-flex;align-items:center;gap:12px;padding:16px 36px;border-radius:999px;font-family:'Space Grotesk';font-weight:700;font-size:26px;letter-spacing:4px;color:#FFC531;border:1px solid rgba(255,197,49,.5);background:rgba(255,197,49,.08);box-shadow:0 0 30px rgba(255,197,49,.25);margin-bottom:48px}
.hero{font-family:'Anton';font-size:190px;line-height:1.05;letter-spacing:2px}
.hero .y{background:linear-gradient(180deg,#FFE29A,#FF9A3C);-webkit-background-clip:text;background-clip:text;color:transparent}
.gl{width:420px;height:4px;border-radius:2px;background:linear-gradient(90deg,#2DD4BF,#FF9A3C);box-shadow:0 0 22px rgba(255,154,60,.8);margin:44px 0}
.cards{display:flex;gap:24px}
.card{width:280px;border-radius:28px;padding:36px 28px;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14)}
.card .n{font-family:'Space Grotesk';font-weight:700;font-size:64px;color:#FFC531}
.card .t{font-size:26px;font-weight:700;margin-top:12px}.card .d{font-size:22px;color:#aab;margin-top:8px}
.cap{position:absolute;bottom:130px;left:64px;right:64px;font-size:46px;font-weight:600;line-height:1.55}
.cap .hl{color:#FFC531}
.prog{position:absolute;bottom:60px;left:64px;right:64px;height:8px;border-radius:4px;background:rgba(255,255,255,.12)}
.prog i{display:block;width:55%;height:100%;border-radius:4px;background:linear-gradient(90deg,#2DD4BF,#FF9A3C)}
