.nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:40px 54px;font-size:23px;font-weight:700;color:#8a94a8}

.cell .n.o{color:#FF9A3C}
.cell .l{font-size:24px;font-weight:700;margin-top:10px;color:#dfe4ee}
.punch{position:absolute;bottom:150px;left:0;right:0;text-align:center;font-size:52px;font-weight:800;letter-spacing:1px}
.punch .r{color:#FF3B5C}
.prog{position:absolute;bottom:70px;left:64px;right:64px;height:8px;border-radius:4px;background:rgba(255,255,255,.1)}
.prog i{display:block;width:46%;height:100%;border-radius:4px;background:linear-gradient(90deg,#2DD4BF,#0EA5A4)}
