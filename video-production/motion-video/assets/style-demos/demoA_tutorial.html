*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:radial-gradient(1200px 900px at 50% 20%,#141a33 0%,#0B0A1A 55%,#060510 100%);color:#fff;font-family:'Plus Jakarta Sans';overflow:hidden;position:relative}
.hdr{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:44px 56px;font-size:26px;font-weight:700}
.hdr .ch{color:#FFB35C}.hdr .tag{border:1px solid rgba(255,179,92,.5);color:#FFB35C;border-radius:999px;padding:10px 26px;font-size:22px}
.wrap{position:absolute;top:170px;left:64px;right:64px}
h1{font-size:64px;font-weight:800;margin-bottom:44px}
h1 .o{color:#FF9A3C}
.step{display:flex;gap:28px;align-items:flex-start;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:32px 36px;margin-bottom:28px}
.num{flex:none;width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:32px}
.n1{background:linear-gradient(135deg,#FF9A3C,#FF6B00)}.n2{background:linear-gradient(135deg,#2DD4BF,#0EA5A4)}.n3{background:linear-gradient(135deg,#A78BFA,#7C3AED)}
.st b{font-size:36px;display:block;margin-bottom:8px}.st span{font-size:28px;color:#aab}
.cap{position:absolute;bottom:120px;left:64px;right:64px;text-align:center;font-size:44px;font-weight:700;line-height:1.5}
.cap .hl{color:#FF9A3C}
.prog{position:absolute;bottom:56px;left:64px;right:64px;height:8px;border-radius:4px;background:rgba(255,255,255,.12)}
.prog i{display:block;width:38%;height:100%;border-radius:4px;background:linear-gradient(90deg,#FF9A3C,#FF6B00)}
.tagrow{display:flex;gap:16px;margin-top:36px;flex-wrap:wrap}
.tagrow span{font-size:24px;font-weight:700;padding:12px 26px;border-radius:999px;background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.4);color:#7DE8DC}
.tagrow span.o{background:rgba(255,154,60,.14);border-color:rgba(255,154,60,.4);color:#FFB35C}
</style></head><body>
<div class="hdr"><span class="ch">◆ AI 60 Giây</span><span class="tag">Paperclip</span></div>
<div class="wrap">
<h1>Chỉ <span class="o">3 bước</span> quản lý<br>cả đội AI agent</h1>
<div class="step"><div class="num n1">01</div><div class="st"><b>Đặt mục tiêu</b><span>Giao việc cho AI rõ ràng</span></div></div>
<div class="step"><div class="num n2">02</div><div class="st"><b>Thuê đội ngũ</b><span>CEO, CTO, dev, marketing</span></div></div>
<div class="step"><div class="num n3">03</div><div class="st"><b>Duyệt &amp; bấm chạy</b><span>Theo dõi trên dashboard</span></div></div>
<div class="tagrow"><span class="o">Claude Code</span><span>Codex</span><span>Cursor</span><span>OpenClaw</span></div>
</div>
<div class="cap">rồi <span class="hl">duyệt chiến lược</span> là chạy</div>
<div class="prog"><i></i></div>
